[colors]
background = #000000
foreground = #ffffff
primary = #202020
alert = #ffffff

[bar/minimal]
width = 100%
height = 24pti
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 0pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${foreground}
font-0 = monospace;2
modules-left = xworkspaces date
modules-center = spotify
modules-right = ipaddress battery cpu memory

[module/xworkspaces]
type = internal/xworkspaces
enable-click = false
enable-scroll = false
label-active = %name%
label-active-background = ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = #555555
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-color = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-color = ${colors.primary}
label = %percentage_used%%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
poll-interval = 5

format-charging = <label-charging>
label-charging = +%percentage%%

format-discharging = <label-discharging>
label-discharging = -%percentage%%

format-full = <label-full>
label-full = 100%

[module/ipaddress]
type = internal/network
interface = wlan0
interval = 3.0

format-connected = <label-connected>
label-connected = %local_ip%
format-disconnected = No IP

[module/spotify]
type = custom/script
tail = true
interval = 1
format = <label>
exec = playerctl -p fastpotify metadata --format "{{ title }} - {{ artist }}" 2>/dev/null || echo "No Track Playing"

[settings]
screenchange-reload = true
pseudo-transparency = true
