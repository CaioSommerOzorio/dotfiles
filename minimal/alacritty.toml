[window]
padding = { x = 10, y = 10 }
opacity = 0.5

[font]
normal = { family = "Iosevka", style = "Regular" }
bold = { family = "Iosevka", style = "Bold" }
italic = { family = "Iosevka", style = "Italic" }
size = 14

[env]
WINIT_X11_SCALE_FACTOR = "1.25"

[colors.primary]
foreground = "#d9d8ce"
background = "#11161A"

[[keyboard.bindings]]
key = "Backspace"
mods = "Control"
chars = "\u0017"

# no limits to the larp
[[keyboard.bindings]]
key = "f"
mods = "Control"
chars = "cls && fastfetch\n"
