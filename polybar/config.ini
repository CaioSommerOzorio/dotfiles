; =========================================================
; ELECTRIC BLUE & ORANGE POLYBAR CONFIG
; =========================================================

[colors]
background = #1b182c
background-alt = #0c0f12
foreground = #cbe3e7
accent = #5cc4ff
disabled = #4a5568
accent-alt = #962a54

[bar/cyberbar]
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
padding-left = 1
padding-right = 1

module-margin = 1

separator = ‖
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;2"

; Left: i3 Workspaces & active app windows
; Center: Spotify Media Tracker
; Right: Hardware Monitoring, Wi-Fi, and Date
modules-left = i3 xwindow
modules-center = spotify
modules-right = cpu memory wlan ip-address date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; =========================================================
; NATIVE i3 & APPLICATION MODULES
; =========================================================

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.accent}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.disabled}

label-visible = %name%
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.accent}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = ${colors.disabled}

; =========================================================
; SPOTIFY SCRIPT MODULE
; =========================================================

[module/spotify]
type = custom/script
tail = true
interval = 1
; Prefix with an icon or text identifier
format-prefix = "   "
format-prefix-foreground = ${colors.accent-alt}
format = <label>
format-foreground = ${colors.accent}
; Uses playerctl to grab title and artist metadata from Spotify
exec = playerctl -p spotify metadata --format "{{ title }} - {{ artist }}" 2>/dev/null || echo "No Track Playing"

; =========================================================
; HARDWARE PERFORMANCE MODULES
; =========================================================

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " CPU "
format-prefix-foreground = ${colors.accent}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " RAM "
format-prefix-foreground = ${colors.accent}
label = %percentage_used%%

; =========================================================
; WI-FI NETWORK MODULE
; =========================================================

[module/wlan]
type = internal/network
; Run 'ip link show' and change 'wlan0' if your wireless card has a different name
interface = wlan0
interface-type = wireless
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = ""
format-connected-prefix-foreground = ${colors.accent}
label-connected = %essid% %downspeed:min%
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
label-disconnected =    Offline
label-disconnected-foreground = ${colors.disabled}

[module/ip-address]
type = internal/network
interface = wlan0
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "IP "
format-connected-prefix-foreground = ${colors.accent}

label-connected = %local_ip%
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
label-disconnected =    No IP
label-disconnected-foreground = ${colors.disabled}

; =========================================================
; DATE & UTILITY
; =========================================================

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label =    %date%
label-foreground = ${colors.accent}

[settings]
screenchange-reload = true
pseudo-transparency = true
