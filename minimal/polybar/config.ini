[colors]
background = #1f1f1f
foreground = #d9d8ce
background-alt = #3e3e3e
alert = #ffffff

[bar/base]
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = Iosevka;2
height = 24pt
module-margin = 1
separator = |
separator-foreground = ${colors.foreground}
radius = 8
pseudo-transparency = true
offset-y = 10px
override-redirect = true
wm-restack = i3
border-size = 2px
border-color = ${colors.foreground}

[bar/left]
width = 13%
offset-x = 10px
inherit = bar/base
modules-left = xworkspaces date
padding-left = 1

[bar/mid]
width = 35%
offset-x = 32.5%
inherit = bar/base
modules-center = spotify

[bar/right]
width = 16%
offset-x = 83.5%
inherit = bar/base
modules-right = battery cpu memory
padding-right = 1

[module/xworkspaces]
type = custom/script
exec = ~/.config/polybar/workspaces.sh
format-prefix = "["
format-suffix = "]"
interval = 0.2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
label = %percentage_used%%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
poll-interval = 5
format-charging = <label-charging>
label-charging = +%percentage%%
format-discharging = <label-discharging>
label-discharging = -%percentage%%
format-full = <label-full>
label-full = 100%


[module/spotify]
type = custom/script
exec = playerctl -p spotify metadata --format "{{ title }} - {{ artist }}" 2>/dev/null || echo "No Track Playing"
interval = 1
format = <label>

[settings]
screenchange-reload = true
