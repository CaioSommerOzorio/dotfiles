[colors]
background = #202528
foreground = #d9d8ce
accent = #B9CC9A
alert = #ffffff

[bar/main]
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = BigBlueTermPlus Nerd Font Mono;10px
height = 40px
module-margin = 1
separator = " "
separator-foreground = ${colors.foreground}
radius = 8
pseudo-transparency = true
override-redirect = true
wm-restack = i3
padding-left = 1
padding-right = 1
width = 97.5%
offset-x = 1.25%

modules-left = xworkspaces date
modules-center = spotify
modules-right = battery cpu memory

[module/xworkspaces]
type = internal/xworkspaces
enable-click = false
enable-scroll = false
label-active = %name%
label-active-foreground = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = #555555
label-empty-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
label = %percentage_used%%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
poll-interval = 5
format-charging = <label-charging>
label-charging = +%percentage%%
format-discharging = <label-discharging>
label-discharging = -%percentage%%
format-full = <label-full>
label-full = 100%


[module/spotify]
type = custom/script
exec = playerctl -p spotify metadata --format "{{ title }} - {{ artist }}" 2>/dev/null || echo "No Track Playing"
interval = 1
format = <label>

[settings]
screenchange-reload = true
