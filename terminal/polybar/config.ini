[colors]
background = #1c1c1c
foreground = #ffffff
secondary = #d47782
background-alt = #3e3e3e
alert = #ffffff

[bar/base]
foreground = ${colors.foreground}
font-0 = BigBlueTermPlus Nerd Font Mono;2
module-margin = 1
separator = " "
radius = 8
pseudo-transparency = true
override-redirect = true
#wm-restack = i3
border-size = 0
offset-x = 5px
width = 110px
height = 24pt

[bar/background]
inherit = bar/base
background = ${colors.background}
modules-center = nothing
height = 44pt

[module/nothing]
type = custom/script
exec = echo ""
interval = 500

# TIME

[bar/timebackground]
inherit = bar/background
offset-y = 8pt

[bar/timeheader]
inherit = bar/base
background = #00000000
modules-center = timeheader
offset-y = 8pt

[bar/time]
inherit = bar/base
background = #00000000
modules-center = time
offset-y = 20pt

[bar/timefooter]
inherit = bar/base
background = #00000000
modules-center = timefooter
offset-y = 32pt


[module/timeheader]
type = custom/script
exec = echo "╭─time──╮"
interval = 500

[module/time]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
format = "│ <label> │"
label = %date%

[module/timefooter]
type = custom/script
exec = echo "╰───────╯"
interval = 500

# WORKSPACES

[bar/workspacebackground]
inherit = bar/background
offset-y = 58pt

[bar/workspaceheader]
inherit = bar/base
background = #00000000
offset-y = 58pt
modules-center = workspaceheader

[bar/workspaces]
inherit = bar/base
background = #00000000
offset-y = 70pt
modules-center = workspaces

[bar/workspacefooter]
inherit = bar/base
background = #00000000
offset-y = 82pt
modules-center = workspacefooter


[module/workspaceheader]
type = custom/script
exec = echo "╭─wspace─╮"
interval = 500

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/workspaces.sh
format = "│   <label>    │"
interval = 0.2

[module/workspacefooter]
type = custom/script
exec = echo "╰────────╯"
interval = 500

#CPU

[bar/cpubackground]
inherit = bar/background
offset-y = 108pt

[bar/cpuheader]
inherit = bar/base
background = #00000000
offset-y = 108pt
modules-center = cpuheader

[bar/cpu]
inherit = bar/base
background = #00000000
offset-y = 120pt
modules-center = cpu

[bar/cpufooter]
inherit = bar/base
background = #00000000
offset-y = 132pt
modules-center = cpufooter


[module/cpuheader]
type = custom/script
exec = echo "╭─cpu────╮"
interval = 500

[module/cpu]
type = internal/cpu
interval = 2
format = "│  <label>   │"
label = %percentage:2%%

[module/cpufooter]
type = custom/script
exec = echo "╰────────╯"
interval = 500

# RAM
[bar/rambackground]
inherit = bar/background
offset-y = 158pt

[bar/ramheader]
inherit = bar/base
background = #00000000
offset-y = 158pt
modules-center = ramheader

[bar/ram]
inherit = bar/base
background = #00000000
offset-y = 170pt
modules-center = memory

[bar/ramfooter]
inherit = bar/base
background = #00000000
offset-y = 182pt
modules-center = ramfooter


[module/ramheader]
type = custom/script
exec = echo "╭─ram────╮"
interval = 500

[module/memory]
type = internal/memory
interval = 2
format = "│  <label>   │"
label = %percentage_used%%

[module/ramfooter]
type = custom/script
exec = echo "╰────────╯"
interval = 500

# BATTERY
[bar/batterybackground]
inherit = bar/background
offset-y = 208pt

[bar/batteryheader]
inherit = bar/base
background = #00000000
offset-y = 208pt
modules-center = batteryheader

[bar/battery]
inherit = bar/base
background = #00000000
offset-y = 220pt
modules-center = battery

[bar/batteryfooter]
inherit = bar/base
background = #00000000
offset-y = 232pt
modules-center = batteryfooter


[module/batteryheader]
type = custom/script
exec = echo "╭─bat────╮"
interval = 500

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
poll-interval = 5
format-charging = "│  <label-charging>  │"
label-charging = +%percentage%%
format-discharging = "│  <label-discharging>  │"
label-discharging = -%percentage%%
format-full = "│  <label-full>  │"
label-full = 100%

[module/batteryfooter]
type = custom/script
exec = echo "╰────────╯"
interval = 500

# VOLUME
[bar/volumebackground]
inherit = bar/background
offset-y = 258pt

[bar/volumeheader]
inherit = bar/base
background = #00000000
offset-y = 258pt
modules-center = volumeheader

[bar/volume]
inherit = bar/base
background = #00000000
offset-y = 270pt
modules-center = volume

[bar/volumefooter]
inherit = bar/base
background = #00000000
offset-y = 282pt
modules-center = volumefooter


[module/volumeheader]
type = custom/script
exec = echo "╭─vol────╮"
interval = 500

[module/volume]
type = internal/pulseaudio
interval = 5
format-volume = "│  <label-volume> │"
label-volume = "%percentage:3%% "
format-muted = <label-muted>

[module/volumefooter]
type = custom/script
exec = echo "╰────────╯"
interval = 500

[settings]
screenchange-reload = true
