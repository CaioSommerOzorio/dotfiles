[window]
padding = { x = 10, y = 10 }

[font]
normal = { family = "Iosevka", style = "Regular" }
bold = { family = "Iosevka", style = "Bold" }
italic = { family = "Iosevka", style = "Italic" }

[colors.primary]
foreground = "#d9d8ce"
background = "#1f1f1f"

[[keyboard.bindings]]
key = "Backspace"
mods = "Control"
chars = "\u0017"

# no limits to the larp
[[keyboard.bindings]]
key = "f"
mods = "Control"
chars = "cls && fastfetch\n"
